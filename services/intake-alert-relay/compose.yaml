services:
  intake-alert-relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CHATWOOT_TOKEN_FILE: /run/secrets/chatwoot_token
      RELAY_CAPABILITY_TOKEN_FILE: /run/secrets/relay_capability
      RELAY_ENCRYPTION_KEY_FILE: /run/secrets/relay_encryption_key
    secrets:
      - chatwoot_token
      - relay_capability
      - relay_encryption_key
    ports:
      - "127.0.0.1:8182:8080"
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
secrets:
  chatwoot_token:
    file: ${CHATWOOT_TOKEN_SECRET_FILE:?private secret file required}
  relay_capability:
    file: ${RELAY_CAPABILITY_SECRET_FILE:?private secret file required}
  relay_encryption_key:
    file: ${RELAY_ENCRYPTION_SECRET_FILE:?private secret file required}
volumes:
  relay-data:
